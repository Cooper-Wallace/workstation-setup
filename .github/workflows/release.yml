name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Semantic Release Gate"
    uses: Cooper-Wallace/repokit/.github/workflows/reusable-release-prep.yml@main
    with:
      release-type: "go"
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || github.token }}
    secrets: inherit

  package-release:
    name: "Package & Upload Assets"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: Cooper-Wallace/repokit/.github/workflows/reusable-release-go.yml@main
    with:
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      go-version: "1.23"
    secrets: inherit
