name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  release-stage:
    name: "Semantic Release Gate"
    uses: Cooper-Wallace/repokit/.github/workflows/reusable-release-prep.yml@main
    with:
      staging-branch: "release-staging"
      target-branch: "main"
    secrets: inherit

  package-release:
    name: "Package & Upload Assets"
    needs: release-stage
    if: ${{ needs.release-stage.outputs.releases_created == 'true' }}
    uses: Cooper-Wallace/repokit/.github/workflows/reusable-release-go.yml@main
    with:
      tag-name: ${{ needs.release-stage.outputs.tag_name }}
      go-version: "1.23"
    secrets: inherit
