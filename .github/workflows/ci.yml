name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: Cooper-Wallace/repokit/.github/workflows/semantic-pr.yml@main

  ci:
    uses: Cooper-Wallace/repokit/.github/workflows/reusable-go.yml@main
    with:
      go-version: "1.23"
      min-coverage: 80
